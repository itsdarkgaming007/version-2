name: Build QuickSender APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'
          cache-disabled: true

      - name: Create Keystore & Build Release APK
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias quicksender -keyalg RSA -keysize 2048 -validity 10000 -storepass "QuickPass123" -keypass "QuickPass123" -dname "CN=QuickSender, OU=Production, O=QuickSender, L=Chennai, ST=TN, C=IN"
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin --no-daemon
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickSender-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
